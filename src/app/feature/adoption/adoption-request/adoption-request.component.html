<app-menu></app-menu>
<div class = "adoption-request">
   <h4>Request For Adoption</h4>
    
    <main class = "single">
<table class="table table-sm">
    <tr>
        <td>Old Customer :</td>
        <td>
            <select [(ngModel)] = "adoptionRequest.customer" class = "rounded">
                <option *ngFor="let c of customers"[ngValue] = "c">
                    {{c.email}}
                </option>
            </select>
        </td>
        <td>For New Customer</td>
        <td>
            <span>
                <a routerLink="/customer/create" class ="btn btn-primary">Add New</a>
              </span>
        </td>
    </tr>
    <tr>
        <td>Reference 1:</td>
        <td>
            <select [(ngModel)] = "adoptionRequest.reference" class = "rounded">
                <option *ngFor="let r of references1"[ngValue] = "r">
                    {{r.firstname+ " " +r.lastname}}
                </option>
            </select>
        </td>
        <td>For New Reference</td>
        <td>
            <span>
                <a routerLink="/reference/create" class ="btn btn-primary">Add New</a>
              </span>
        </td>
    </tr>
    <tr>
        <td>Reference 2:</td>
        <td>
            <select [(ngModel)] = "reference2" class = "rounded">
                <option *ngFor="let f of references2"[ngValue] = "f">
                    {{f.firstname+ " " +f.lastname}}
                </option>
            </select>
        </td>
        <td>For New Reference</td>
        <td>
            <span>
                <a routerLink="/reference/create" class ="btn btn-primary">Add New</a>
              </span>
        </td>
    </tr>
</table>
<span><button (click)="submit()"  class="btn btn-primary">Submit</button></span>
    </main>
</div>
