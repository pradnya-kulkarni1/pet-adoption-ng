<app-menu></app-menu>
<div class="reference-create">
  <h4>Create Reference</h4>
    
    <p *ngIf="!reference">Loading...</p>
    <div *ngIf="reference">
      <main class="single">
        <table class="table table-sm">
          <tr>
            <td>Firstname:</td>
            <td>
              <input [(ngModel)]="reference.firstname" class="rounded" type="text" />
            </td>
          </tr>
          <tr>
            <td>Lastname:</td>
            <td>
              <input [(ngModel)]="reference.lastname" class="rounded" type="text" />
            </td>
          </tr>
          <tr>
            <td>Phone:</td>
            <td>
              <input [(ngModel)]="reference.phone" class="rounded" type="text" />
            </td>
          </tr>
          <tr>
            <td>Email:</td>
            <td>
              <input [(ngModel)]="reference.email" class="rounded" type="text" />
            </td>
          </tr>
        </table>
      </main>
      <span>
        <button (click)="save()" class="btn btn-sm btn-primary">Save</button>
      </span>
      <p *ngIf="message">{{ message }}</p>
    </div>
  </div>
