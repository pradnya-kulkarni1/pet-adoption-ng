<app-menu></app-menu>
<div  class="pet-list">
    <section [style.color]='"brown"' class="heading">
        <span  class="page-title font-weight-bold font-italic">{{title}}</span>
        <a routerLink = "/pet/create">
            <img width="20" height="20" src="assets/add-icon.png" title="Add new"/>
        </a>
    </section>
    <table *ngIf = "pets" class="table table-sm table-striped">

    <thead>
        <tr><th>Pet Details<th>Action</th></tr>
    </thead>
    <tbody>
        <tr *ngFor="let pet of pets">
            <td>{{pet.id}}
            {{pet.name}}
            {{pet.breed.name}}
            {{pet.gender}}
            {{pet.birthYear}}
            {{pet.birthMonth}}
            {{pet.available}}
            <img width="250" height="200" src="{{pet.photoPath}}">
            <td>
                <a routerLink="/pet/details/{{ pet.id }}">
                  <img
                    width="20"
                    height="20"
                    src="assets/details.png"
                    title="Species Details"
                  />
                </a>
                <a routerLink="/pet/edit/{{ pet.id }}">
                  <img
                    width="20"
                    height="20"
                    src="assets/pencil-icon.png"
                    title="Edit Specie"
                  />
                </a>
              </td> 
        </tr>
    </tbody>

    </table>
</div>
