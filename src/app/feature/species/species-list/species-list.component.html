<app-menu></app-menu>
<div class = "species-list">
  <section [style.color]='"brown"' class="heading">
    <h4>Species List</h4>
        <a *ngIf="isUser" routerLink="/species/create">Add New
          <img width="20" height="20" src="assets/add-icon.png" title="Add New" />
        </a>
        </section>
<table *ngIf="speciess" class = "table table-warning">
    <thead>
        <tr><th>Id</th><th>Name</th><th>Adoption Fee</th><th *ngIf="isUser">Action</th></tr>
    </thead>
    <tbody>
        <tr *ngFor="let s of speciess">
            <td>{{s.id}}</td>
            <td>{{s.name}}</td>
            <td>{{s.adoptionFee| currency}}</td>
            <td>
                <a *ngIf="isUser" routerLink="/species/details/{{ s.id }}">
                  <img
                    width="20"
                    height="20"
                    src="assets/details.png"
                    title="Species Details"
                  />
                </a>
                <a *ngIf="isUser" routerLink="/species/edit/{{ s.id }}">
                  <img
                    width="20"
                    height="20"
                    src="assets/pencil-icon.png"
                    title="Edit Specie"
                  />
                </a>
              </td> 
        </tr>
    </tbody>
</table>
</div>
