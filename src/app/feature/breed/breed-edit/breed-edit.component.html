<app-menu></app-menu>
<div class="breed-edit">
    <h4>Edit Breed Details</h4>
    <p *ngIf="!breed">Loading...</p>
    <div *ngIf="breed">
      <main class="single">
        <table class="table-sm">
          <tr>
            <td>Id:</td>
            <td>
              <input [(ngModel)]="breed.id" class="rounded" type="text" disabled/>
            </td>
          </tr>
          <tr>
            <td>Breed Name:</td>
            <td>
              <select [(ngModel)]="breed.species.name" class="rounded">>
                <option *ngFor="let s of speciess" [ngValue]="s.name">
                  {{ s.name }}
                </option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Name:</td>
            <td>
              <input [(ngModel)]="breed.name" class="rounded" type="text"/>
            </td>
          </tr>
        </table>
    </main>
    <span >
      <span> <button (click)="save()" class="btn btn-primary">Save</button></span>
  </span>
    <p *ngIf="message">{{ message }}</p>
  </div>
</div>
