<app-menu></app-menu>
<div  class="breed-detail">
  <h4>Details of Breed</h4>
    <p *ngIf="!breed">Loading...</p>
    <div *ngIf="breed">
      <main class="single">
        <table class="table table-sm">
          <tr>
            <td>Id:</td>
            <td>
              <input
                [(ngModel)]="breed.id"
                class="rounded"
                type="text"
                disabled
              />
            </td>
          </tr>
          <tr>
            <td>Specie Name:</td>
            <td>
              <input [(ngModel)]="breed.species.name" class="rounded" type="text" disabled/>
            </td>
          </tr>
          <tr>
            <td>Name:</td>
            <td>
              <input [(ngModel)]="breed.name" class="rounded" type="text" disabled/>
            </td>
          </tr>
        </table>
    </main>
    <span>
      <span
        ><button routerLink="/breed/edit/{{ breed.id }}"
          class="btn btn-sm btn-warning"
          >Edit</button
        ></span
      >
      <span>
        |
        <button (click)="delete()" class="btn btn-sm btn-danger">
          Delete
        </button></span
      >
    </span>
    <p *ngIf="message">{{ message }}</p>
  </div>
</div>
