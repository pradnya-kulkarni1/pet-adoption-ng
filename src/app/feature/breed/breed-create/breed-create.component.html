<app-menu></app-menu>
<div class="breed-create">
   <h4>Create a New Breed</h4>
    
    <p *ngIf="!breed">Loading...</p>
    <div *ngIf="breed">
      <main class="single">
        <table class="table table-sm">
            <tr>
                <td>Specie:</td>
                <td>
                    <select [(ngModel)]="breed.species" class="rounded">
                      <option *ngFor="let s of speciess" [ngValue]="s">
                        {{ s.name }}
                      </option>
                    </select>
                  </td>
              </tr>
          <tr>
            <td>Name:</td>
            <td>
              <input [(ngModel)]="breed.name" class="rounded" type="text" />
            </td>
          </tr>
        </table>
    </main>
    <span>
      <button (click)="save()" class="btn btn-sm btn-primary">Save</button>
    </span>
    <p *ngIf="message">{{ message }}</p>
  </div>
</div>
