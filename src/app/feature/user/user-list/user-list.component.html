<app-menu></app-menu>

<div class = "user-list">
    <section class = "heading">
<h4>User List</h4>
<a routerLink="/user/create">
  <img width="20" height="20" src="assets/add-icon.png" title="Add New" />
</a>
</section>

<table *ngIf="users" class = "table table-sm table-warning">
  <thead>
    <tr><th>Id</th><th>Firstname</th><th>Lastname</th><th>Phone</th><th>Email</th><th>Password</th><th>Action</th></tr>
  </thead>

<tbody>
<tr *ngFor="let user of users">
    <td>{{user.id}}</td>
    <td>{{user.firstname}}</td>
    <td>{{user.lastname}}</td>
    <td>{{user.phone}}</td>
    <td>{{user.email}}</td>
    <td>{{user.password}}</td>
    <td>
      <a routerLink="/user/details/{{ user.id }}">
        <img
          width="20"
          height="20"
          src="assets/details.png"
          title="User Details"
        />
      </a>
      <a routerLink="/user/edit/{{ user.id }}">
        <img
          width="20"
          height="20"
          src="assets/pencil-icon.png"
          title="Edit User"
        />
      </a>
    </td>   
</tr>
</tbody>
</table>
</div>
<div class="row">
  <div class="card">
    <img height="200" width="250" src="assets/hira.jpg" alt="">
    <h4>Hira</h4>
  </div>
  <div class="card">
    <img height="200" width="250" src="assets/max.jpg" alt="">
    <h4>MAX</h4>
  </div>
  <div class="card">
    <img height="200" width="250" src="assets/milo.jpg" alt="">
    <h4>Milo</h4>
  </div>
<div class="card">
  <img height="200" width="250" src="assets/buddy.jpg" alt="">
  <h4>Buddy</h4>
</div>
</div>
