<app-menu></app-menu>
<div class = "review">
        <section [style.color]='"brown"' class="heading">
            <h4>Adoption Request Review</h4>
    </section>
    <table class="table able-sm table-striped">
        <thead>
            <tr>
            <th>Id</th>
            <th>Customer</th>
            <th>User</th>
            <th>Status</th>
            <th>Submitted Date</th>
            <th>BackGround Check</th>
            <th>Reference Check</th>
            <th>Reason For Rejection</th>
            <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let ar of adoptionRequests">
                <td>{{ar.id}}</td>
                <td>{{ar.customer.firstname +" "+ ar.customer.lastname}}</td>
                <td>{{ar.user.firstname +" "+ar.user.lastname}}</td>
                <td>{{ar.status}}</td>
                <td>{{ar.submittedDate| date:'MM/dd/yyyy'}}</td>
            
                <td>
                <input [(ngModel)]="ar.backgroundCheck" class="rounded" type="checkbox" style="text-align:center" />
                </td>
                <td>
                <input [(ngModel)]="ar.referenceCheck" class ="rounded" type = "checkbox" style="text-align:center"/>
                </td>
                <td>
                <input [(ngModel)]="ar.rejectionReason" class="rounded" type="text"/>
                </td>
                <td><span *ngIf="ar.rejectionReason"><button (click)="approveOrReject(this.ar.id,this.ar.rejectionReason)" class="reject"[disabled]="!ar.rejectionReason.trim()" >Reject</button></span>
                
                <span><button (click)="approveOrReject(this.ar.id,this.ar.rejectionReason)"
                    class="approve"[disabled]="!ar.backgroundCheck || !ar.referenceCheck">Approve</button></span>
                </td>
            </tr>
        </tbody>
    </table>
</div>
